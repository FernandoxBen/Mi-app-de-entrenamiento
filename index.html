function tuckTimer(){ const el = $('#sheet'); if (el && el.classList.contains('on')) { RT.minimized = true; el.classList.remove('on'); syncTimerDock(); } }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const a = t.dataset.act;
  if (a === 'open')   { go('day', t.dataset.id); }
  else if (a === 'to-clock') { clockFromDay(t.dataset.day, String(t.dataset.slots||'').split('§')); }
  else if (a.startsWith('ck-')) { clockAction(a, t); }
  else if (a.startsWith('mn-')) { manualAction(a, t); }
  else if (a === 'plan-week') { planWeekOffset += Number(t.dataset.n); render(); }
  else if (a === 'warm-check') { const w = warmRecord(); w.checks[t.dataset.i] = !w.checks[t.dataset.i]; w.done = false; S.warmups[dateKey()] = w; save(); renderHere(); }
  else if (a === 'warm-done') { const w = warmRecord(); w.done = true; S.warmups[dateKey()] = w; save(); toast('Calentamiento completado.'); history.length > 1 ? history.back() : go('hoy'); }
  else if (a === 'tab')    { go(t.dataset.v); }
  else if (a === 'back')   { history.length > 1 ? history.back() : go('hoy'); }
  else if (a === 'scrim' || a === 'ex-menu-close') { EXMENU = null; renderExMenu(); }
  else if (a === 'ex-menu') { tuckTimer(); EXMENU = t.dataset.slot; renderExMenu(); haptic(12); }
  else if (a === 'fav') { S.favorites[t.dataset.id]=!S.favorites[t.dataset.id];save();renderHere(); }
  else if (a === 'manual-timer') { if(RT.ready&&!RT.done){RT.minimized=false;$('#sheet').classList.add('on');tickRest();}else timerMode('down'); }
  else if (a === 'timer-close') { skipRest(); }
  else if (a === 'timer-minimize') { RT.minimized=true;$('#sheet').classList.remove('on');syncTimerDock(); }
  else if (a === 'timer-expand') { RT.minimized=false;$('#sheet').classList.add('on');syncTimerDock(); }
  else if (a === 'rnd')    { const n = Math.max(0, Math.min(99, wodRounds(t.dataset.day, t.dataset.k) + (+t.dataset.d)));
                             setWodRounds(t.dataset.day, t.dataset.k, t.dataset.nm, n); haptic(14); renderHere(); }
  else if (a === 'pick')   { S.picks[t.dataset.k] = +t.dataset.i; save(); haptic(12); renderHere(); }
  else if (a === 'fold')   { t.classList.toggle('open'); t.setAttribute('aria-expanded', t.classList.contains('open'));
                             const m = t.nextElementSibling; if (m && m.classList.contains('mini')) m.classList.toggle('hid'); }
  else if (a === 'alt')    { const h = t.nextElementSibling; h.classList.toggle('open'); }
  else if (a === 'wod')    { startRest(+t.dataset.sec, t.dataset.nm, 'Cuenta atrás del bloque'); haptic(20); }
  else if (a === 'hdet')   { const d = $('#d-'+CSS.escape(t.dataset.id)); if (d) { d.classList.toggle('open'); t.setAttribute('aria-expanded', d.classList.contains('open')); } }
  else if (a === 'hdel')   { if (confirm('¿Borrar esta sesión del historial?')) { S.history = S.history.filter(h => h.id !== t.dataset.id); save(); renderHere(); toast('Sesión borrada.'); } }
  else if (a === 'sw')     { S.settings[t.dataset.k] = !S.settings[t.dataset.k]; save(); render(); haptic(12); }
  else if (a === 'export') { exportData(); }
  else if (a === 'import') { $('#fimp').click(); }
  else if (a === 'wipe')   { if (confirm('Se borran sesiones, récords y ajustes. ¿Seguro?')) { S = JSON.parse(JSON.stringify(DEF)); clockLoop(); save(); render(); toast('Todo borrado.'); } }
  else if (a === 'install'){ install(); }
  else if (a === 'rest+')  { addRest(15); }
  else if (a === 'rest-')  { addRest(-15); }
  else if (a === 'rest30') { addRest(30); }
  else if (a === 'timer-mode') { timerMode(t.dataset.mode); }
  else if (a === 'timer-pause') { pauseTimer(); }
  else if (a === 'timer-reset') { resetTimer(); }
  else if (a === 'skip')   { skipRest(); }
  else if (a === 'update') { location.reload(); }
});
function manualAction(a, t){
  const m = manualState();
  if (a === 'mn-toggle') { m.open = !t.parentElement.open; return; }
  if (a === 'mn-add') { const last = m.rows[m.rows.length-1] || {}; m.rows.push({kg:last.kg ?? null, reps:last.reps ?? null}); }
  else if (a === 'mn-del') { if (m.rows.length > 1) m.rows.splice(+t.dataset.i, 1); }
  else if (a === 'mn-save') { manualSave(); return; }
  m.open = true; renderHere();
}
document.addEventListener('change', e => {
  const act = e.target.dataset && e.target.dataset.act;
  if (act === 'mn-ex') { manualPick(e.target.value); manualState().open = true; renderHere(); return; }
  if (act === 'mn-date') { manualState().date = e.target.value || dateKey(); return; }
  if (act === 'ck-ex') {
    const c = clk(), v = e.target.value;
    if (v === '__new') { c.items = []; c.typing = true; }
    else {
      c.items = [{ id:v, nm:clockName(v) }]; c.typing = false; c.custom = ''; c.dayId = ''; c.target = {};
      const d = clockDefaults(v); if (d) { c.sets = Math.max(1, Math.min(10, +d.sets || 4)); c.rest = Math.max(15, Math.min(600, +d.rest || 90)); }
    }
    save(); renderHere();
    if (c.typing) { const i = $('[data-act="ck-custom"]'); if (i) i.focus(); }
    return;
  }
  if (act === 'swap-ex') {
    const id = e.target.value, slot = e.target.dataset.slot, day = dayById(DAYVIEW);
    const base = day && flatEx(day).find(x => exKey(x) === slot);
    if (!base || !altList(base).some(x => x.id === id)) return;
    S.drafts[day.id] = S.drafts[day.id] || {};
    if (id === base.id) delete S.drafts[day.id][slot]; else S.drafts[day.id][slot] = id;
    rememberExercise(id); save(); renderHere(); return;
  }
  if (e.target.dataset.setting) { const k=e.target.dataset.setting; S.settings[k]=Math.max(30,Math.min(300,+e.target.value||DEF.settings[k]));save();render();return; }
  if (e.target.dataset.planDay != null) { setPlan(+e.target.dataset.planDay, e.target.value || null); return; }
  if (e.target.id === 'fimp' && e.target.files[0]) { importData(e.target.files[0]); e.target.value = ''; }
});
document.addEventListener('input', e => {

  const items = ckItems(c), pair = items.length > 1, n = c.done + 1, last = n >= c.sets;
  const refs = items.map(x => { const rs = ((c.ref||{})[x.id] || {}).setData || [], ls = rs[c.done] || rs[rs.length-1], tg = (c.target||{})[x.id];
    return (tg || ls) ? `<div class="ck-ref">${pair ? esc(x.nm) + ' · ' : ''}${tg ? `objetivo <b>${esc(tg)}</b>` : ''}${ls ? `${tg ? ' · ' : ''}la última vez <b>${esc(setLabel(ls))}</b>` : ''}</div>` : ''; }).join('');
  return `<div class="ck-stage">
    ${c.dayId ? `<div class="ck-from">${clockPosition(c)}</div>` : ''}
    <div class="ck-ex">${esc(ckName(c))}</div>
    <div class="ck-k">${pair ? 'Ronda' : 'Serie'}</div>
    <div class="ck-big"><b>${n}</b><span>/ ${c.sets}</span></div>
    ${clockDots(c)}
    ${refs}
    <div class="ck-sw"><span id="ck-sw">${mmss((Date.now() - c.t0) / 1000)}</span> en la ${pair ? 'ronda' : 'serie'}</div>
    <button class="ck-done ck-save" data-act="ck-setdone">${pair ? 'Ronda hecha' : 'Serie hecha'}<small>${last ? 'y anotar' : `y descansar ${mmss(c.rest)}`}</small></button>
    <button class="btn ck-quiet" data-act="ck-finish">Terminar el ejercicio aquí</button>
  </div>`;
}
function clockRestView(c){
  const left = c.paused ? c.left : Math.max(0, c.restEnd - Date.now());
  const R = 88, C = 2*Math.PI*R, f = Math.max(0, Math.min(1, left / (c.restTotal || c.rest*1000)));
  return `<div class="ck-stage rest">
    ${c.dayId ? `<div class="ck-from">${clockPosition(c)}</div>` : ''}
    <div class="ck-ex">${esc(ckName(c))}</div>
    <div class="ck-k">${c.paused ? 'Descanso en pausa' : 'Descanso'} · ${c.done} de ${c.sets} hechas</div>
    <div class="ck-ring${c.paused ? ' paused' : ''}">
      <svg viewBox="0 0 200 200" aria-hidden="true"><circle class="bg" cx="100" cy="100" r="${R}"/>
        <circle id="ck-ring" class="fg" cx="100" cy="100" r="${R}" stroke-dasharray="${(C*f).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 100 100)"/></svg>
      <div class="t" id="ck-time" role="timer">${mmss(Math.ceil(left/1000))}</div>
    </div>
    <div class="ck-next">Siguiente: <b>${ckItems(c).length > 1 ? 'ronda' : 'serie'} ${c.done + 1} de ${c.sets}</b></div>
    <div class="ck-ctrl"><button data-act="ck-radj" data-d="-15" aria-label="Quince segundos menos">−15 s</button>
      <button data-act="ck-pause">${c.paused ? 'Seguir' : 'Pausa'}</button>
      <button data-act="ck-radj" data-d="15" aria-label="Quince segundos más">+15 s</button></div>
    <button class="ck-done ghost" data-act="ck-skiprest">Empezar ya</button>
    <button class="btn ck-quiet" data-act="ck-finish">Terminar el ejercicio aquí</button>
  </div>`;
}
function clockLogView(c){
  const items = ckItems(c), pair = items.length > 1;
  return `<div class="ck-stage ck-log">
    <div class="ck-ex">${esc(ckName(c))}</div>
    <div class="ck-k">${c.done} ${c.done === 1 ? 'serie hecha' : 'series hechas'} · anota cómo han ido</div>
    ${items.map(x => {
      const rows = c.rows[x.id] || [], ref = (c.ref||{})[x.id];
      return `<div class="lg-card">${pair ? `<div class="lg-name">${esc(x.nm)}</div>` : ''}
        <div class="lg-head"><span>Serie</span><span>kg</span><span>reps</span></div>
        ${rows.map((r, i) => `<div class="lg-row"><b>${i + 1}</b>
          <input class="ck-text" type="number" inputmode="decimal" step="0.5" min="0" max="1000" data-act="lg-kg" data-id="${esc(x.id)}" data-i="${i}" value="${r.kg != null ? r.kg : ''}" placeholder="—" aria-label="Kilos de la serie ${i + 1}${pair ? ' de ' + esc(x.nm) : ''}">
          <input class="ck-text" type="number" inputmode="numeric" step="1" min="1" max="100" data-act="lg-reps" data-id="${esc(x.id)}" data-i="${i}" value="${r.reps || ''}" placeholder="—" aria-label="Repeticiones de la serie ${i + 1}${pair ? ' de ' + esc(x.nm) : ''}"></div>`).join('')}
        ${ref ? `<div class="lg-ref">La última vez: ${esc(refText(ref))}</div>` : ''}
      </div>`; }).join('')}
    <div class="lg-tip">Viene relleno con lo de la última vez. Si cambias el peso de una serie, las siguientes con el mismo peso cambian también.</div>
    <button class="ck-done ck-save" data-act="ck-save"${clockHasReps(c) ? '' : ' disabled'}>Guardar<small>en el registro</small></button>
    <button class="btn ck-quiet" data-act="ck-discard">Salir sin guardar</button>
  </div>`;
}
function clockDone(c){
  const items = ckItems(c), next = clockNextUnit(c), day = c.dayId && dayById(c.dayId);
  const lines = items.map(x => {
    const rows = (c.rows[x.id]||[]).filter(r => r.reps > 0);
    const best = rows.reduce((m,s) => (s.kg != null && (m == null || s.kg > m)) ? s.kg : m, null);
    const ref = (c.ref||{})[x.id];
    const prev = ref ? ((ref.setData||[]).reduce((m,s) => (s && s.kg != null && (m == null || +s.kg > m)) ? +s.kg : m, null) ?? (ref.kg != null ? +ref.kg : null)) : null;
    const d = (best != null && prev != null) ? Math.round((best - prev) * 10) / 10 : null;
    const delta = d == null ? '' : d > 0 ? ` · <b class="up">+${d} kg vs la última</b>` : d < 0 ? ` · ${d} kg vs la última` : ' · mismo peso que la última';
    return `<div class="ck-sum">${items.length > 1 ? `<span>${esc(x.nm)}</span>` : ''}${rows.length ? rows.map(s => esc(setLabel(s))).join(' · ') : 'Sin series anotadas'}</div>${delta ? `<div class="ck-ref">${delta.replace(/^ · /,'')}</div>` : ''}`;
  }).join('');
  const nextName = next && day ? next.map(e => chosenEx(day, e).nm).join(' + ') : '';
  return `<div class="ck-stage">
    <div class="ck-ok">${svg('check',3)}</div>
    <div class="ck-ex">${esc(ckName(c))}</div>
    <div class="ck-k">Guardado en el registro</div>
    ${lines}
    ${next ? `<button class="ck-done ck-save" data-act="ck-next">Siguiente<small>${esc(nextName)}</small></button>` : day ? `<div class="ck-ref"><b>${esc(day.name)}</b>: no te queda ningún ejercicio por anotar hoy.</div>` : ''}
    <div class="btnrow">${day ? `<button class="btn" data-act="ck-day">Volver al ${esc(day.name)}</button>` : ''}<button class="btn" data-act="ck-more">Una serie más</button><button class="btn" data-act="ck-new">Otro ejercicio</button></div>
  </div>`;
}
function clockSub(){
  const c = clk();
  if (c.phase === 'setup') return ckItems(c).length && c.dayId ? 'Listo para empezar' : 'Elige ejercicio, series y descanso';
  if (c.phase === 'done') return 'Ejercicio guardado';
  if (c.phase === 'log') return 'Anota las series';
  if (c.phase === 'rest') return `Descanso antes de la serie ${c.done + 1}`;
  return `Serie ${c.done + 1} de ${c.sets}`;
}

/* ---------------- arranque ---------------- */
(function(){
  const entry = applyEntry();
  const h = (location.hash||'').replace('#','').split('/');
  if (h[1] && LEGACY_DAYS[h[1]]) h[1] = LEGACY_DAYS[h[1]];
  if (h[0] === 'day' && h[1] && dayById(h[1])) { VIEW = 'day'; DAYVIEW = h[1]; }
  else if (['hoy','semana','reloj','historial','ajustes'].includes(h[0])) VIEW = h[0];
  else if (entry && entry.day && dayById(entry.day)) { VIEW = 'day'; DAYVIEW = entry.day; }
  else if (entry && entry.view) VIEW = entry.view;
  render();
  try { history.replaceState({v:VIEW,d:DAYVIEW}, '', '#'+VIEW+(DAYVIEW?'/'+DAYVIEW:'')); } catch(e){}
  try { localStorage.setItem('__probe','1'); localStorage.removeItem('__probe'); }
  catch(e){ setTimeout(() => toast('Este navegador no deja guardar datos: el historial no se conservará al cerrar.'), 900); }
  if (clockActive()) wake(true);
  clockLoop();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloading || sessionStorage.getItem('entreno-reloaded')) return;
      if (clockActive()) { toast('<b>Actualización lista</b><br><button data-act="update" style="color:#75f0bd;margin-top:5px">Aplicar al terminar</button>'); return; }
      reloading = true; sessionStorage.setItem('entreno-reloaded','1'); location.reload();
    });
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').then(r => r.update()).catch(()=>{}));
  }
})();

</script>
</body>
