<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c1118">
<meta name="description" content="Entreno 4.0.0 · Upper, Lower y Metabólico, reloj de series y registro de pesos sin conexión.">
<title>Entreno 4.0.0</title>

<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entreno">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" href="./icon-180.png">

<style>
:root{
  --f-sans:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-disp:'Arial Narrow','Roboto Condensed',Impact,ui-sans-serif,system-ui,sans-serif;
  --f-mono:'Cascadia Code','SFMono-Regular',Consolas,'Roboto Mono',ui-monospace,monospace;

  --c-upper:#5b9bff; --c-upperb:#9b8cff; --c-leg:#23d6a0; --c-cf:#e0a44f;
  --c-mob:#2fe0c0; --c-extra:#4ec9e8;
  --coral:#ff8080; --gold:#ffc65c;

  --bg:#07111f;
  --t1:#f2f4f7; --t2:#aab4c6; --t3:#8494ab;
  --gl:rgba(255,255,255,.055); --gl2:rgba(255,255,255,.085);
  --gb:rgba(255,255,255,.11); --gb2:rgba(255,255,255,.17);
  --r:14px; --rl:20px; --rs:10px;
  --accent:var(--c-upper);
  --nav-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;height:100%}
body{
  min-height:100%;color:var(--t1);font-family:var(--f-sans);line-height:1.5;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  background:
    radial-gradient(90% 55% at 8% 0%, rgba(91,155,255,.18), transparent 55%),
    radial-gradient(80% 50% at 100% 16%, rgba(35,214,160,.13), transparent 55%),
    radial-gradient(90% 55% at 50% 102%, rgba(255,198,92,.10), transparent 55%),
    var(--bg);
  background-attachment:fixed;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
::selection{background:color-mix(in srgb,var(--accent) 45%,transparent)}

/* ---------------- layout ---------------- */
.wrap{max-width:620px;margin:0 auto;padding:0 18px}
#app{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px)}
.view{display:none;animation:in .22s cubic-bezier(.2,.7,.3,1)}
.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view.on,.sheet,.player{animation:none!important}}

/* ---------------- top bar ---------------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;
  padding:calc(12px + env(safe-area-inset-top)) 18px 12px;
  background:rgba(11,15,22,.88);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2);
  border-bottom:1px solid transparent;transition:border-color .2s}
.top.stuck{border-bottom-color:var(--gb)}
.top h1{font-family:var(--f-disp);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.top .sub{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--t3);margin-top:5px}
.top .act{margin-left:auto;display:flex;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:var(--gl);border:1px solid var(--gb);color:var(--t2);transition:.16s}
.iconbtn:hover{background:var(--gl2);color:var(--t1)}
.iconbtn:focus-visible,button:focus-visible,[role=button]:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.iconbtn svg{width:18px;height:18px}

/* ---------------- bottom nav ---------------- */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  padding:0 8px calc(env(safe-area-inset-bottom));height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  background:rgba(11,15,22,.86);backdrop-filter:blur(22px) saturate(1.25);-webkit-backdrop-filter:blur(22px) saturate(1.25);
  border-top:1px solid var(--gb)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--t3);font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;transition:color .18s}
#nav button svg{width:21px;height:21px;transition:transform .18s}
#nav button.on{color:var(--accent)}
#nav button.on svg{transform:translateY(-1px)}
#nav button:active svg{transform:scale(.9)}

/* ---------------- generic blocks ---------------- */
.sec{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin:26px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--gb)}
.sec::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.sec h2{flex:1 1 auto;min-width:0;font-family:var(--f-disp);font-weight:700;font-size:clamp(15px,4vw,17px);
  letter-spacing:.06em;text-transform:uppercase;line-height:1.15}
.sec .meta{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--t3);letter-spacing:.03em;white-space:nowrap}
.sec.fold{cursor:pointer;user-select:none}
.sec .chev{color:var(--t3);font-size:12px;transition:transform .2s,color .2s}
.sec.open .chev{transform:rotate(180deg);color:var(--accent)}

.card{border-radius:var(--rl);padding:18px;background:var(--gl);border:1px solid var(--gb);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.tip,.note{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--t2);line-height:1.5;
  margin:8px 0;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,.045);
  border:1px solid var(--gb);border-left:3px solid var(--accent)}
.tip b,.note b{color:var(--t1);font-weight:600}
.tip::before{content:"i";font-family:var(--f-mono);font-style:italic;font-weight:700;color:var(--accent);flex:0 0 auto}
.note{background:rgba(255,128,128,.09);border-color:rgba(255,128,128,.26);border-left-color:var(--coral)}
.note::before{content:"!";font-family:var(--f-mono);font-weight:700;color:var(--coral);flex:0 0 auto}
.principle{font-size:13px;color:var(--t2);line-height:1.55;margin:6px 0 2px;padding:14px 16px;border-radius:var(--r);
  background:rgba(255,255,255,.045);border:1px solid var(--gb);border-left:3px solid var(--accent)}
.principle b{color:var(--t1);font-weight:600}
.empty{text-align:center;color:var(--t3);font-size:13px;padding:34px 20px;line-height:1.6}
.empty b{display:block;color:var(--t2);font-family:var(--f-disp);font-size:19px;text-transform:uppercase;margin-bottom:6px;letter-spacing:.04em}

/* ---------------- hero / today ---------------- */
.hero{padding:6px 0 2px}
.herocard{position:relative;overflow:hidden;border-radius:24px;padding:22px;margin-top:14px;
  background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 34%,transparent),color-mix(in srgb,var(--accent) 9%,transparent) 70%),var(--gl);
  border:1px solid color-mix(in srgb,var(--accent) 34%,var(--gb));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.herocard .kick{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.herocard h2{font-family:var(--f-disp);font-weight:700;font-size:clamp(30px,8.5vw,42px);line-height:1;text-transform:uppercase;
  margin:8px 0 6px;letter-spacing:.01em}
.herocard p{font-size:13px;color:rgba(255,255,255,.78);margin-bottom:16px}
.herocard .go{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:52px;border-radius:15px;
  font-family:var(--f-disp);font-weight:700;font-size:20px;letter-spacing:.05em;text-transform:uppercase;color:#0b0f16;
  background:#fff;transition:transform .14s}
.herocard .go:active{transform:scale(.975)}
.herocard .go svg{width:17px;height:17px}
.herocard .go.ghost{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff}
.herocard .dual{display:flex;gap:9px}
.herocard .dual .go{font-size:15px;min-height:46px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{border-radius:var(--r);padding:14px 12px;background:var(--gl);border:1px solid var(--gb);text-align:center}
.stat .v{font-family:var(--f-mono);font-weight:700;font-size:22px;letter-spacing:-.03em;color:var(--t1);line-height:1}
.stat .v small{font-size:11px;color:var(--t3);font-weight:500}
.stat .l{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--t3);margin-top:6px}

.ring{display:block;margin:0 auto}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .bgc{stroke:rgba(255,255,255,.09)}
.ring .fg{stroke:var(--accent);transition:stroke-dasharray .5s cubic-bezier(.2,.7,.3,1)}
.ring text{font-family:var(--f-mono);font-weight:700;font-size:16px;fill:var(--t1)}

/* ---------------- day cards ---------------- */
.cards{display:grid;gap:11px;padding:6px 0 10px}
.dcard{--dc:var(--c-upper);position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  overflow:hidden;border-radius:var(--rl);padding:17px;min-height:86px;color:#fff;
  background:linear-gradient(140deg,color-mix(in srgb,var(--dc) 24%,transparent),color-mix(in srgb,var(--dc) 7%,transparent) 72%),var(--gl);
  border:1px solid color-mix(in srgb,var(--dc) 30%,var(--gb));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12);transition:transform .18s cubic-bezier(.2,.7,.3,1),border-color .2s}
.dcard:active{transform:scale(.985)}
.dcard.done{border-color:color-mix(in srgb,var(--dc) 55%,transparent)}
.dcard .ic{width:40px;height:40px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:9px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.16);border-radius:12px}
.dcard .ic svg{width:100%;height:100%}
.dcard .lab{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.dcard .day{font-family:var(--f-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.62)}
.dcard .tt{font-family:var(--f-disp);font-weight:700;font-size:clamp(18px,4.8vw,24px);line-height:1.06;text-transform:uppercase;letter-spacing:.02em}
.dcard .st{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.6);overflow-wrap:break-word}
.dcard .flag{flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22)}
.dcard .flag svg{width:14px;height:14px}
.dcard.done .flag{background:var(--c-leg);border-color:var(--c-leg);color:#08111f}

/* ---------------- exercise rows ---------------- */
.ex{border-radius:var(--r);margin-bottom:8px;background:rgba(255,255,255,.045);border:1px solid var(--gb);overflow:hidden;transition:border-color .18s}
.ex.full{border-color:color-mix(in srgb,var(--c-leg) 45%,transparent);background:color-mix(in srgb,var(--c-leg) 7%,rgba(255,255,255,.045))}
.ex .hd{display:flex;align-items:flex-start;gap:12px;padding:13px 15px}
.ex .idx{font-family:var(--f-mono);font-size:10px;font-weight:700;color:var(--accent);width:18px;flex:0 0 auto;padding-top:3px}
.ex .body{flex:1;min-width:0}
.ex .nm{font-size:14.5px;font-weight:600;line-height:1.3;overflow-wrap:break-word}
.ex .cue{font-size:12px;color:var(--t2);margin-top:3px;line-height:1.45}
.ex .cue b{color:var(--t1);font-weight:600}
.ex .dose{font-family:var(--f-mono);font-weight:700;font-size:15px;color:var(--accent);text-align:right;flex:0 0 auto;
  letter-spacing:-.02em;line-height:1.15;white-space:nowrap}
.ex .dose .u{display:block;color:var(--t3);font-weight:500;font-size:9px;letter-spacing:.05em;margin-top:2px}
.ex .last{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.05em;color:var(--t3);margin-top:6px}
.ex .last b{color:var(--c-leg);font-weight:700}
.exguide{margin:0 15px 12px;border-top:1px solid rgba(255,255,255,.08);padding-top:9px}
.exguide summary{cursor:pointer;color:var(--accent);font-family:var(--f-mono);font-size:10px;font-weight:700;letter-spacing:.05em;list-style:none;padding:8px 0;min-height:40px;display:flex;align-items:center}
.exguide summary::-webkit-details-marker{display:none}
.exguide summary::before{content:'＋';display:inline-block;width:18px;color:var(--t3)}
.exguide[open] summary::before{content:'−'}
.exguide p{font-size:12.5px;color:var(--t2);line-height:1.55;margin-top:8px}
.exguide p b{color:var(--t1);font-weight:600}

.track{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:10px;padding:0 15px 13px}
.track.round-track{display:flex;flex-wrap:wrap;gap:8px}
.set-dots{display:grid;grid-template-columns:repeat(auto-fit,minmax(62px,1fr));gap:8px;min-width:0}
.dot{width:100%;min-width:0;height:44px;padding:0 6px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--f-mono);font-size:11px;font-weight:700;color:var(--t3);line-height:1.1;
  background:rgba(255,255,255,.05);border:1px solid var(--gb);transition:.16s}
.dot:active{transform:scale(.94)}
.dot.on{color:#08111f;background:var(--c-leg);border-color:var(--c-leg)}
.dot .kgv{font-size:12.5px;letter-spacing:-.02em}
.dot .rv{font-size:8.5px;opacity:.78;letter-spacing:.02em}
.setlog{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;color:var(--t3);padding:0 15px 11px;margin-top:-4px}
.setlog b{color:var(--c-leg);font-weight:700}
.setlog b.up{color:var(--c-leg)}.setlog .down{color:var(--coral);font-weight:700}
.sete{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;gap:10px;align-items:center;margin-bottom:12px}
.sete button{height:52px;border-radius:14px;border:1px solid var(--gb);background:var(--gl);color:var(--t1);font-size:20px;font-weight:700}
.sete button:active{transform:scale(.95)}
.sete .val{text-align:center;min-width:0}
.sete .val b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:700;letter-spacing:-.02em}
.sete .val span{display:block;font-family:var(--f-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--t3);margin-top:2px}
#scrim{position:fixed;inset:0;z-index:65;background:rgba(4,8,14,.55);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
.exm-note{font-family:var(--f-mono);font-size:11.5px;color:var(--t2);line-height:1.5;padding:11px 12px;border-radius:11px;
  background:rgba(255,255,255,.05);border:1px solid var(--gb)}
/* ---------------- progreso ---------------- */
.pchart{width:100%;height:150px;display:block;margin:6px 0 2px}
.pchart .kg{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pchart .rm{fill:none;stroke:color-mix(in srgb,var(--gold) 70%,transparent);stroke-width:1.6;stroke-dasharray:4 4}
.pchart circle{fill:var(--accent)}
.pchart .gl{stroke:rgba(255,255,255,.08);stroke-width:1}
.pchart .ax,.pchart text{font-family:var(--f-mono);font-size:8.5px;fill:var(--t3);letter-spacing:.04em}
.plegend{display:flex;gap:16px;font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:12px}
.plegend i{display:inline-block;width:14px;height:2px;margin-right:6px;vertical-align:3px;border-radius:2px}
.plegend i.kg{background:var(--accent)}.plegend i.rm{background:var(--gold)}
.delta{padding:13px 15px;border-radius:var(--r);margin-bottom:12px;background:rgba(255,255,255,.045);border:1px solid var(--gb);border-left:3px solid var(--t3)}
.delta b{display:block;font-family:var(--f-mono);font-size:19px;font-weight:700;letter-spacing:-.02em}
.delta span{display:block;font-size:11.5px;color:var(--t2);line-height:1.45;margin-top:3px}
.delta.up{border-left-color:var(--c-leg)}.delta.up b{color:var(--c-leg)}
.delta.down{border-left-color:var(--coral)}.delta.down b{color:var(--coral)}
.delta.flat{border-left-color:var(--gold)}.delta.flat b{color:var(--gold)}
.pstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 6px}
.pstats .stat{padding:13px 8px;border-radius:var(--r);background:rgba(255,255,255,.045);border:1px solid var(--gb);text-align:center}
.pstats .v{font-family:var(--f-mono);font-weight:700;font-size:20px;letter-spacing:-.02em}
.pstats .v small{font-size:9px;color:var(--t3);font-weight:500}
.pstats .l{font-family:var(--f-mono);font-size:8px;letter-spacing:.09em;text-transform:uppercase;color:var(--t3);margin-top:4px;line-height:1.3}
.lrow .n .sets{display:block;font-family:var(--f-mono);font-size:11px;color:var(--t3);font-weight:500;margin-top:3px;overflow-wrap:break-word}
.wvol{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;align-items:end;padding:12px 10px 8px;border-radius:var(--r);
  background:rgba(255,255,255,.045);border:1px solid var(--gb)}
.wvol .wv{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.wvol i{display:block;width:100%;border-radius:4px 4px 2px 2px;background:color-mix(in srgb,var(--accent) 45%,transparent)}
.wvol i.now{background:var(--accent)}
.wvol span{font-family:var(--f-mono);font-size:8px;color:var(--t3);white-space:nowrap}
.wvol-foot{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-mono);font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--t3);margin:7px 2px 0}
.wgt{display:flex;align-items:center;justify-content:flex-end;gap:5px;height:44px}
.wgt input{width:68px;min-height:44px;text-align:center;font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--t1);
  background:rgba(255,255,255,.05);border:1px solid var(--gb);border-radius:10px;padding:7px 6px}
.wgt input::placeholder{color:var(--t3);font-weight:500}
.wgt span{font-family:var(--f-mono);font-size:9.5px;color:var(--t3);letter-spacing:.08em}
.ex-select{width:100%;min-height:46px;padding:0 36px 0 11px;border-radius:11px;background:#101b2b;border:1px solid var(--gb2);color:var(--t1);font-weight:600}
.slot-label{font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.ex .nm{margin-top:3px}
.ex .nm .exname{display:block;min-width:0;font-size:14.5px;font-weight:600;line-height:1.3;overflow-wrap:break-word}
.ex .nm .swapped{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;vertical-align:2px;
  font-family:var(--f-mono);font-size:8px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;
  color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);border:1px solid color-mix(in srgb,var(--accent) 34%,transparent)}
.ex-edit{width:44px;min-width:44px;height:44px;min-height:44px;flex:0 0 auto;align-self:flex-start;border-radius:12px;
  border:1px solid var(--gb);background:var(--gl);color:var(--t2);font-size:17px;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:.15s}
.ex-edit:active{transform:scale(.94)}
.ex.skipped{opacity:.5}.ex.skipped .track{display:none}
.exm-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.exm-head .k{font-family:var(--f-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--t3)}
.exm-head .n{font-size:16px;font-weight:600;margin-top:3px;overflow-wrap:break-word}
.exm-field{display:block;margin-bottom:12px}
.exm-field span{display:block;font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin-bottom:6px}
.exm-field input{width:100%;min-height:46px;padding:0 12px;border-radius:11px;background:rgba(255,255,255,.05);
  border:1px solid var(--gb);color:var(--t1);font-size:14px}
.exm-acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.exm-acts button{min-height:46px;border-radius:12px;border:1px solid var(--gb);background:var(--gl);color:var(--t1);
  font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px;transition:.15s}
.exm-acts button[disabled]{opacity:.35}
.exm-acts button:not([disabled]):active{transform:scale(.97)}
.exm-acts .wide{grid-column:1 / -1}
.exm-acts .pri-close{color:#08111f;background:var(--accent);border-color:var(--accent);font-weight:700}
.skip-note{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--t3);padding:0 15px 13px}
.add-ex{margin:14px 0;padding:14px;border-radius:var(--r);border:1px dashed var(--gb2);background:rgba(255,255,255,.025)}
.add-ex select{width:100%;min-height:46px;padding:0 12px;border-radius:12px;background:#101b2b;border:1px solid var(--gb2)}

.ss{border:1px solid var(--gb);border-radius:var(--r);overflow:hidden;margin-bottom:8px}
.ss .tag{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;font-weight:700;color:#fff;padding:8px 15px;border-bottom:1px solid var(--gb);
  background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 32%,transparent),color-mix(in srgb,var(--accent) 10%,transparent))}
.ss .tag button{min-height:44px;padding:4px 10px;border-radius:10px}
.ss .ex{border:0;border-radius:0;margin:0;background:none}
.ss .ex+.ex{border-top:1px solid rgba(255,255,255,.07)}

/* ---------------- mini list (bloques plegables) ---------------- */
.mini{background:rgba(255,255,255,.045);border:1px solid var(--gb);border-radius:var(--r);padding:2px 16px}
.mini.hid{display:none}
.mini .m{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;font-size:13.5px;color:var(--t2);
  border-bottom:1px solid rgba(255,255,255,.07)}
.mini .m:last-child{border-bottom:0}
.mini .m b{color:var(--t1);font-weight:500;min-width:0;overflow-wrap:break-word}
.mini .m .d{font-family:var(--f-mono);font-size:11.5px;font-weight:700;color:var(--accent);white-space:nowrap}
.mini .grp{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.13em;font-size:9.5px;color:var(--t3);
  padding:13px 0 4px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.07)}

/* ---------------- calentamiento ---------------- */
.wprog{margin:0 0 14px}
.wprog span{display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin-bottom:7px}
.wbar{height:5px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden}
.wbar i{display:block;height:100%;border-radius:3px;background:var(--c-leg);transition:width .3s cubic-bezier(.2,.7,.3,1)}
.wgroup{margin-bottom:14px}
.wgroup .grp{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.13em;font-size:9.5px;font-weight:700;color:var(--t3);padding:0 2px 8px}
.witem{background:rgba(255,255,255,.045);border:1px solid var(--gb);border-radius:var(--r);margin-bottom:8px;overflow:hidden;
  transition:border-color .18s,background .18s}
.witem.ck{border-color:color-mix(in srgb,var(--c-leg) 42%,transparent);background:color-mix(in srgb,var(--c-leg) 7%,rgba(255,255,255,.045))}
.wrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px}
.wname{min-width:0;display:flex;flex-direction:column;gap:2px}
.wname b{font-size:14px;font-weight:600;color:var(--t1);line-height:1.25;overflow-wrap:break-word}
.wname .es{font-size:11.5px;color:var(--t3);line-height:1.3;overflow-wrap:break-word}
.witem.ck .wname b{color:var(--t2)}
.wrow .d{font-family:var(--f-mono);font-size:11.5px;font-weight:700;color:var(--accent);white-space:nowrap}
.warm-check{width:44px;min-width:44px!important;height:44px;min-height:44px!important;padding:0!important;border-radius:13px;font-size:15px;align-self:center}
.witem.ck .warm-check{color:#08111f;background:var(--c-leg);border-color:var(--c-leg)}
.warm-how{border-top:1px solid rgba(255,255,255,.07);padding:0 14px 2px}
.warm-how summary{min-height:44px;display:flex;align-items:center;cursor:pointer;list-style:none;
  font-family:var(--f-mono);font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--accent)}
.warm-how summary::-webkit-details-marker{display:none}
.warm-how summary::before{content:'＋';display:inline-block;width:18px;color:var(--t3)}
.warm-how[open] summary::before{content:'−'}
.warm-how p{font-size:12.5px;color:var(--t2);line-height:1.55;padding:0 0 12px 18px}

/* ---------------- picker ---------------- */
.pick{margin-bottom:10px}
.pickhint{font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin:0 0 6px 2px}
.po{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 15px;margin-bottom:7px;border-radius:var(--r);
  background:rgba(255,255,255,.045);border:1px solid var(--gb);opacity:.62;transition:opacity .18s,background .2s,border-color .2s}
.po .nm{font-size:14px;font-weight:600;flex:1;min-width:0}
.po .nm::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--t3);
  margin-right:9px;vertical-align:1px;transition:.2s}
.po .cue{font-size:12px;color:var(--t2);margin-top:3px;line-height:1.45}
.po .dose{font-family:var(--f-mono);font-weight:700;font-size:14px;color:var(--accent);white-space:nowrap}
.po.sel{opacity:1;background:linear-gradient(140deg,color-mix(in srgb,var(--accent) 55%,transparent),color-mix(in srgb,var(--accent) 22%,transparent) 76%),var(--gl);
  border-color:color-mix(in srgb,var(--accent) 68%,transparent)}
.po.sel .nm{color:#fff}
.po.sel .nm::before{background:#fff;border-color:#fff}
.po.sel .cue{color:rgba(255,255,255,.82)}
.po.sel .dose{color:#fff}
.how{display:none;font-size:12.5px;color:var(--t2);line-height:1.55;margin:-3px 0 9px;padding:12px 15px;border-radius:12px;
  background:rgba(255,255,255,.05);border:1px solid var(--gb);border-left:3px solid var(--accent)}
.how.open{display:block}
.how b{color:var(--t1);font-weight:600}

/* ---------------- session player ---------------- */
.player{position:fixed;inset:0;z-index:60;overflow-y:auto;display:none;background:var(--bg);
  background-image:radial-gradient(90% 55% at 8% 0%, color-mix(in srgb,var(--accent) 16%,transparent), transparent 55%)}
.player.on{display:block;animation:up .26s cubic-bezier(.2,.7,.3,1)}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.phead{position:sticky;top:0;z-index:5;padding:calc(12px + env(safe-area-inset-top)) 18px 10px;
  background:rgba(11,15,22,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--gb)}
.phead .row1{display:flex;align-items:center;gap:12px}
.phead .ttl{flex:1;min-width:0}
.phead .ttl b{display:block;font-family:var(--f-disp);font-size:21px;text-transform:uppercase;letter-spacing:.03em;line-height:1.05}
.phead .ttl span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3)}
.pbar{height:4px;border-radius:3px;background:rgba(255,255,255,.09);margin-top:11px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:3px;background:var(--accent);width:0;transition:width .35s cubic-bezier(.2,.7,.3,1)}
.pbody{padding:14px 0 190px}
.finish{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:54px;border-radius:16px;margin-top:18px;
  font-family:var(--f-disp);font-weight:700;font-size:20px;letter-spacing:.05em;text-transform:uppercase;color:#08111f;
  background:var(--c-leg);transition:transform .14s}
.finish:active{transform:scale(.98)}
.finish svg{width:20px;height:20px;flex:0 0 auto}
.btn svg,.go svg,.finish svg,.iconbtn svg{flex:0 0 auto}
.finish[disabled]{opacity:.45}
.notes{width:100%;min-height:70px;resize:vertical;font-size:13px;line-height:1.45;color:var(--t1);
  background:rgba(255,255,255,.045);border:1px solid var(--gb);border-radius:var(--r);padding:12px 14px;margin-top:6px}
.notes::placeholder{color:var(--t3)}

/* ---------------- rest timer sheet ---------------- */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.7,.3,1);
  padding:16px 18px calc(18px + env(safe-area-inset-bottom));
  background:rgba(13,18,26,.94);backdrop-filter:blur(24px) saturate(1.2);-webkit-backdrop-filter:blur(24px) saturate(1.2);
  border-top:1px solid var(--gb);border-radius:22px 22px 0 0}
.sheet:not(.on){visibility:hidden;pointer-events:none}
.sheet.on{transform:translateY(0);visibility:visible}
.sheet .grab{width:38px;height:4px;border-radius:3px;background:var(--gb2);margin:0 auto 14px}
.sheet .row{display:flex;align-items:center;gap:14px}
.sheet .cd{position:relative;width:82px;height:82px;flex:0 0 auto}
.sheet .cd .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--f-mono);font-weight:700;font-size:21px;letter-spacing:-.03em}
.sheet .info{flex:1;min-width:0}
.sheet .info .k{font-family:var(--f-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--t3)}
.sheet .info .n{font-size:15px;font-weight:600;margin-top:3px;overflow-wrap:break-word}
.sheet .info .s{font-family:var(--f-mono);font-size:11px;color:var(--t3);margin-top:3px}
.sheet .btns{display:flex;gap:8px;margin-top:14px}
.sheet .btns button{flex:1;min-height:46px;border-radius:13px;font-family:var(--f-mono);font-size:12px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--t1);background:var(--gl);border:1px solid var(--gb);transition:.15s}
.sheet .btns button:active{transform:scale(.96)}
.sheet .btns button.pri{color:#08111f;background:var(--accent);border-color:var(--accent)}
.sheet .modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.sheet .modes button{min-height:40px;border-radius:11px;border:1px solid var(--gb);color:var(--t2)}.sheet .modes button.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.sheet .btns{display:grid;grid-template-columns:repeat(3,1fr)}

/* ---------------- history ---------------- */
.hitem{display:flex;align-items:center;gap:13px;padding:14px 15px;margin-bottom:8px;border-radius:var(--r);
  background:rgba(255,255,255,.045);border:1px solid var(--gb);width:100%;text-align:left}
.hitem .pill{width:42px;flex:0 0 auto;text-align:center;border-radius:10px;padding:6px 0;
  background:color-mix(in srgb,var(--dc,var(--accent)) 22%,transparent);border:1px solid color-mix(in srgb,var(--dc,var(--accent)) 34%,transparent)}
.hitem .pill b{display:block;font-family:var(--f-mono);font-weight:700;font-size:15px;line-height:1}
.hitem .pill span{font-family:var(--f-mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.hitem .m{flex:1;min-width:0}
.hitem .m b{font-size:14px;font-weight:600;display:block}
.hitem .m span{font-family:var(--f-mono);font-size:10px;color:var(--t3);letter-spacing:.04em}
.hitem .kg{font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--accent);white-space:nowrap}
.hdet{padding:2px 15px 14px;margin:-8px 0 8px;border-radius:0 0 var(--r) var(--r);
  background:rgba(255,255,255,.03);border:1px solid var(--gb);border-top:0;display:none}
.hdet.open{display:block}
.hdet .l{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:12.5px;color:var(--t2);
  border-bottom:1px solid rgba(255,255,255,.06)}
.hdet .l:last-child{border-bottom:0}
.hdet .l b{color:var(--t1);font-weight:500}
.hdet .l span{font-family:var(--f-mono);font-size:11.5px;color:var(--accent);white-space:nowrap}
.hdet .nt{font-size:12.5px;color:var(--t2);font-style:italic;padding:9px 0 2px;line-height:1.5}

.liftseg{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:0 0 8px}
.liftseg button{min-height:44px;padding:0 10px;border-radius:12px;font-family:var(--f-mono);font-size:11px;font-weight:700;line-height:1.2;
  color:var(--t2);background:rgba(255,255,255,.05);border:1px solid var(--gb);transition:.15s;
  display:flex;align-items:center;justify-content:center;text-align:center}
.liftseg button.on{color:#08111f;background:var(--accent);border-color:var(--accent)}
.liftseg button:active{transform:scale(.97)}

.chart{width:100%;height:120px;display:block;margin:6px 0 4px}
.chart .bar{fill:color-mix(in srgb,var(--accent) 65%,transparent);transition:fill .2s}
.chart .bar.now{fill:var(--accent)}
.chart .gl{stroke:rgba(255,255,255,.07);stroke-width:1}
.chart text{font-family:var(--f-mono);font-size:8px;fill:var(--t3);letter-spacing:.06em}
.spark{width:100%;height:52px;display:block;margin-top:8px}
.spark path{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spark circle{fill:var(--accent)}
.prow{display:flex;align-items:center;gap:12px;padding:12px 15px;margin-bottom:8px;border-radius:var(--r);
  background:rgba(255,255,255,.045);border:1px solid var(--gb)}
.prow .n{flex:1;min-width:0;font-size:13.5px;font-weight:600}
.prow .v{font-family:var(--f-mono);font-weight:700;font-size:15px;color:var(--gold);white-space:nowrap}
.prow .v small{font-size:9px;color:var(--t3);font-weight:500;letter-spacing:.06em}

/* ---------------- settings ---------------- */
.set{display:flex;align-items:center;gap:14px;padding:14px 15px;margin-bottom:8px;border-radius:var(--r);
  background:rgba(255,255,255,.045);border:1px solid var(--gb)}
.set .l{flex:1;min-width:0}
.set .l b{display:block;font-size:14px;font-weight:600}
.set .l span{font-size:11.5px;color:var(--t3);line-height:1.4;display:block;margin-top:2px}
.sw{width:60px;height:44px;border-radius:23px;flex:0 0 auto;background:rgba(255,255,255,.1);border:1px solid var(--gb);
  position:relative;transition:.2s}
.sw::after{content:'';position:absolute;top:4px;left:4px;width:34px;height:34px;border-radius:50%;background:var(--t2);transition:.2s}
.sw.on{background:color-mix(in srgb,var(--accent) 60%,transparent);border-color:var(--accent)}
.sw.on::after{transform:translateX(17px);background:#fff}
.seg{display:flex;gap:6px;flex:0 0 auto}
.seg button{min-width:46px;min-height:36px;border-radius:10px;font-family:var(--f-mono);font-size:11px;font-weight:700;
  color:var(--t2);background:rgba(255,255,255,.05);border:1px solid var(--gb);transition:.15s}
.seg button.on{color:#08111f;background:var(--accent);border-color:var(--accent)}
.btnrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px}
.btn{flex:1;min-width:0;min-height:46px;padding:0 14px;border-radius:13px;font-family:var(--f-sans);font-size:13px;font-weight:600;color:var(--t1);
  background:var(--gl);border:1px solid var(--gb);transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--gl2)}
.btn:active{transform:scale(.98)}
.btn.danger{color:var(--coral);border-color:rgba(255,128,128,.3)}
.btn svg{width:15px;height:15px}

/* ---------------- toast ---------------- */
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 18px);transform:translate(-50%,20px);
  z-index:90;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100% - 36px);
  padding:12px 18px;border-radius:14px;font-size:13px;font-weight:500;text-align:center;
  background:rgba(20,27,38,.97);border:1px solid var(--gb2);box-shadow:0 8px 30px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translate(-50%,0)}

footer{color:var(--t3);font-size:9.5px;text-align:center;padding:26px 0 10px;font-family:var(--f-mono);letter-spacing:.14em}

/* ---------------- v2: identidad, accesibilidad y recuperación ---------------- */
.skip{position:fixed;left:14px;top:10px;z-index:120;transform:translateY(-160%);padding:10px 14px;border-radius:10px;
  color:#07111f;background:#fff;font-weight:700;text-decoration:none;transition:transform .18s}
.skip:focus{transform:none}
.brandmark{width:42px;height:42px;border-radius:13px;object-fit:cover;box-shadow:0 10px 28px rgba(0,0,0,.28);flex:0 0 auto}
.top{min-height:70px}.top>div{min-width:0}.top h1{font-size:28px}.top .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progression{display:grid;gap:8px;margin:8px 0 16px;counter-reset:steps}
.progression .step{counter-increment:steps;display:grid;grid-template-columns:30px 1fr;gap:11px;align-items:start;padding:13px 14px;
  border-radius:13px;background:rgba(255,255,255,.04);border:1px solid var(--gb);font-size:12.5px;color:var(--t2);line-height:1.45}
.progression .step::before{content:counter(steps);width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-family:var(--f-mono);font-weight:700;color:#07111f;background:var(--accent)}
.progression b{display:block;color:var(--t1);margin-bottom:2px}
.badge-v2{display:inline-flex;align-items:center;margin-left:7px;padding:3px 7px;border-radius:999px;background:rgba(98,217,197,.14);
  border:1px solid rgba(98,217,197,.34);color:#7ce8d6;font-family:var(--f-mono);font-size:8px;letter-spacing:.09em;vertical-align:middle}
.offline-note{font-size:11px;color:var(--t3);text-align:center;margin:9px 0 0}
.week-switch{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;gap:10px;align-items:center;margin:10px 0}
.week-switch .btn{width:52px;min-width:52px;padding:0}
.week-switch span{text-align:center;min-width:0}
.planner-row select{min-width:155px}
.finish + .btn{width:100%;margin-top:10px}
.review-card summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}.review-card p{margin-top:12px;color:var(--t2);font-size:13px;line-height:1.55}.review-card p b{color:var(--t1)}
@media(max-width:420px){
  .wrap{padding:0 14px}.top{padding-left:14px;padding-right:14px}.top h1{font-size:23px}
  .herocard{padding:18px}.herocard .dual{flex-direction:column}
  .planner-row{align-items:stretch;flex-wrap:wrap}.planner-row .l{flex-basis:100%}.planner-row select{width:100%;max-width:none!important}
  .ex .hd{gap:9px;padding:12px}.ex .dose{font-size:13px}.track{padding-left:12px;padding-right:12px;gap:8px}
  .session-head{flex-wrap:wrap}.session-head .btn{flex-basis:100%!important}
  .set{flex-wrap:wrap}.set .seg{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.set .seg button{width:100%;min-width:0;min-height:44px}
}
@media(min-width:760px){.wrap{max-width:760px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.herocard{padding:28px}.stats{gap:14px}}

@media(max-width:360px){
  .stats{gap:7px}.stat{padding:12px 8px}.stat .v{font-size:19px}
  .set-dots{grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:6px}.track{gap:6px}.wgt input{width:60px}
  .dot .kgv{font-size:11.5px}.dot .rv{font-size:8px}
  .wrow{grid-template-columns:44px minmax(0,1fr);gap:4px 10px;padding:11px 12px}
  .wrow .warm-check{grid-row:1 / span 2}.wrow .d{grid-column:2;justify-self:start}
  .warm-how{padding:0 12px 2px}
  .finish{font-size:18px}
  .ex-tools{grid-template-columns:40px 40px 1fr 40px;gap:6px}
}

/* 2.6 · mobile training surface */
:root{--bg:#0c1118;--t1:#f5f7fa;--t2:#b9c4d2;--t3:#8e9cad;--c-upper:#4c8dff;--c-upperb:#62d9c5;--c-leg:#79a7ff;--c-mob:#62d9c5;--c-cf:#8d9dff;--c-extra:#56b9e9;--r:18px;--rl:20px;--f-disp:var(--f-sans)}
body{background:var(--bg)}
.view{animation:none}.wrap{max-width:680px}
.top{background:rgba(12,17,24,.96);padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:16px}

/* ---------------- reloj ---------------- */
.ck-card{padding:18px 16px 16px;border-radius:var(--rl);background:rgba(255,255,255,.045);border:1px solid var(--gb);margin:14px 0}
.ck-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.07)}
.ck-row>span{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--t3)}
.ck-step{display:grid;grid-template-columns:52px minmax(84px,auto) 52px;align-items:center;gap:8px}
.ck-step button{height:52px;border-radius:14px;border:1px solid var(--gb);background:var(--gl);color:var(--t1);font-size:22px;font-weight:700}

.ck-step b{text-align:center;font-family:var(--f-mono);font-size:26px;font-weight:700;letter-spacing:-.02em}
.ck-chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:4px 0 6px}
.ck-chips button{min-height:44px;border-radius:12px;border:1px solid var(--gb);background:rgba(255,255,255,.05);color:var(--t2);font-family:var(--f-mono);font-size:12px;font-weight:700}
.ck-chips button.on{color:#07111f;background:var(--accent);border-color:var(--accent)}
.ck-go{min-height:64px;font-size:22px}
.ck-text{width:100%;min-height:46px;padding:0 12px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid var(--gb);color:var(--t1);font-size:15px}
.ck-ref{font-size:12.5px;color:var(--t2);line-height:1.5;margin:2px 0 8px}
.ck-ref b{color:var(--t1);font-family:var(--f-mono)}
.ck-ref b.up{color:var(--c-leg)}
.ck-stage{display:flex;flex-direction:column;align-items:stretch;text-align:center;padding:16px 0 8px;gap:10px}
.ck-ex{font-family:var(--f-disp);font-weight:700;font-size:clamp(22px,6.5vw,30px);line-height:1.1;text-transform:uppercase;letter-spacing:.02em;overflow-wrap:break-word}
.ck-k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--t3)}
.ck-big{display:flex;align-items:baseline;justify-content:center;gap:10px;line-height:1}
.ck-big b{font-family:var(--f-mono);font-size:clamp(96px,30vw,140px);font-weight:700;letter-spacing:-.06em}
.ck-big span{font-family:var(--f-mono);font-size:clamp(28px,8vw,40px);color:var(--t3);font-weight:700}
.ck-dots{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:2px 0 4px}
.ck-dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.14)}
.ck-dots i.on{background:var(--c-leg)}
.ck-dots i.cur{background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}
.ck-sw{font-family:var(--f-mono);font-size:12px;color:var(--t3)}
.ck-sw span{color:var(--t2);font-weight:700}
.ck-done{min-height:76px;border-radius:20px;border:0;background:var(--c-leg);color:#07140f;font-family:var(--f-disp);font-size:26px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-top:8px;transition:transform .12s}
.ck-done:active{transform:scale(.98)}
.ck-done.ghost{min-height:56px;font-size:16px;letter-spacing:.02em;background:var(--gl);color:var(--t1);border:1px solid var(--gb)}
.ck-quiet{min-height:46px;background:transparent;color:var(--t3);border-color:transparent}
.ck-num{width:100%;background:transparent;border:0;color:var(--t1);text-align:center;font-family:var(--f-mono);font-size:30px;font-weight:700;letter-spacing:-.02em;padding:0;min-height:48px}
.ck-num::placeholder{color:var(--t3)}
.ck-num::-webkit-outer-spin-button,.ck-num::-webkit-inner-spin-button,.ck-text::-webkit-outer-spin-button,.ck-text::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ck-num,.ck-text[type=number]{-moz-appearance:textfield;appearance:textfield}
.ck-ring{position:relative;width:min(76vw,300px);aspect-ratio:1;margin:2px auto}
.ck-ring svg{width:100%;height:100%;display:block}
.ck-ring .bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:12}
.ck-ring .fg{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;transition:stroke-dasharray .25s linear}
.ck-ring.paused .fg{stroke:var(--gold)}
.ck-ring .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:clamp(56px,17vw,80px);font-weight:700;letter-spacing:-.04em}
.ck-ring .t.low{color:var(--coral)}
.ck-next{font-size:14px;color:var(--t2)}
.ck-next b{color:var(--t1)}
.ck-ctrl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ck-ctrl button{min-height:56px;border-radius:16px;border:1px solid var(--gb);background:var(--gl);color:var(--t1);font-family:var(--f-mono);font-size:14px;font-weight:700}
.ck-ok{width:64px;height:64px;margin:4px auto;border-radius:50%;background:var(--c-leg);color:#07140f;display:flex;align-items:center;justify-content:center}
.ck-ok svg{width:30px;height:30px}
.ck-sum{font-family:var(--f-mono);font-size:15px;color:var(--t1);line-height:1.6}
.ck-stage .setlog{padding:0;margin:0;text-align:center}
body.ck-flash{animation:ckflash .9s ease-out}
@keyframes ckflash{0%{box-shadow:inset 0 0 0 9999px color-mix(in srgb,var(--c-leg) 35%,transparent)}100%{box-shadow:inset 0 0 0 9999px transparent}}
.manual summary{min-height:44px;display:flex;align-items:center;cursor:pointer;list-style:none;font-weight:700;font-size:15px;color:var(--accent)}
.manual summary::-webkit-details-marker{display:none}
.manual[open] summary{margin-bottom:10px}
.mn-head,.mn-row{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 44px;gap:8px;align-items:center}
.mn-head{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin:4px 0 6px}
.mn-row{margin-bottom:8px}
.mn-row b{font-family:var(--f-mono);font-size:14px;color:var(--t3);text-align:center}
.mn-row .ck-text{text-align:center;font-family:var(--f-mono);font-weight:700;min-height:46px}
.mn-del{width:44px;height:44px;border-radius:12px;border:1px solid var(--gb);background:transparent;color:var(--t3)}
.mn-del[disabled]{opacity:.3}
.mn-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
.mn-save:not([disabled]){color:#07111f;background:var(--accent);border-color:var(--accent)}
.ck-banner{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;text-align:left;margin:14px 0 4px;padding:14px 16px;border-radius:var(--r);
  background:color-mix(in srgb,var(--c-leg) 16%,rgba(255,255,255,.04));border:1px solid color-mix(in srgb,var(--c-leg) 45%,transparent);color:var(--t1)}
.ck-banner .k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--c-leg)}
.ck-banner b{font-size:17px}.ck-banner span:last-child{font-size:12px;color:var(--t2)}
.ck-save{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.05}
.ck-save small{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:none;font-weight:700;opacity:.75}

/* ---------------- 4.0 · entrenos y reloj ---------------- */
.hero-list{list-style:none;counter-reset:hl;margin:-6px 0 16px;display:grid;gap:5px}
.hero-list li{counter-increment:hl;display:flex;gap:10px;font-size:14px;font-weight:600;color:#14284a;line-height:1.35}
.hero-list li::before{content:counter(hl);font-family:var(--f-mono);font-size:11px;font-weight:700;color:#5a77a3;min-width:14px;padding-top:2px}
.hero-list li.more::before{content:'+'}
.hero-list li.more{color:#4d6890;font-weight:500}
.herocard .dual .go{flex-direction:column;gap:1px;line-height:1.15;min-height:58px}
.herocard .dual .go small{font-family:var(--f-mono);font-size:10.5px;font-weight:600;opacity:.75}

  background:color-mix(in srgb,var(--c-leg) 10%,rgba(255,255,255,.03));border:1px solid color-mix(in srgb,var(--c-leg) 30%,var(--gb))}

.to-clock{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:50px;border-radius:14px;font-weight:750;font-size:15px;
  color:#07140f;background:var(--c-leg);transition:transform .12s}
.to-clock svg{width:18px;height:18px}
.to-clock:active{transform:scale(.98)}
.to-clock.again{color:var(--t1);background:var(--gl);border:1px solid var(--gb2)}
.to-clock.live{color:#07111f;background:var(--gold)}
.ex .setlog,.ss>.setlog{padding:0 15px 8px;font-family:var(--f-mono);font-size:11px;color:var(--c-leg)}
.ss.full{border-color:color-mix(in srgb,var(--c-leg) 45%,transparent)}
.rounds-n{font-family:var(--f-mono);font-weight:700;font-size:17px;min-width:30px;text-align:center}
.rounds-l{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-left:4px}
.round-track .dot{width:44px;height:44px}
.round-track .dot[disabled]{opacity:.35}
.plan-select{max-width:55%;min-height:46px;padding:0 12px;border-radius:10px;background:var(--bg);color:var(--t1);border:1px solid var(--gb2);font-weight:600}
.wrow.nock{grid-template-columns:minmax(0,1fr) auto}
.ck-from{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.ck-ready{text-align:left}
.ck-ready .ck-ex{margin:6px 0 8px}
.ck-ready .ck-go{margin-top:14px}
.ck-banner.warn{background:color-mix(in srgb,var(--gold) 16%,rgba(255,255,255,.04));border-color:color-mix(in srgb,var(--gold) 50%,transparent)}
.ck-banner.warn .k{color:var(--gold)}
.ck-banner.soft{background:var(--gl);border-color:var(--gb)}
.ck-banner.soft .k{color:var(--accent)}
.ck-log{text-align:left}
.ck-log .ck-ex,.ck-log .ck-k{text-align:center}
.lg-card{padding:14px;border-radius:var(--r);background:rgba(255,255,255,.045);border:1px solid var(--gb)}
.lg-name{font-weight:700;font-size:15px;margin-bottom:8px}
.lg-head,.lg-row{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center}
.lg-head{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin-bottom:6px;text-align:center}
.lg-row{margin-bottom:8px}
.lg-row b{font-family:var(--f-mono);font-size:15px;color:var(--t3);text-align:center}
.lg-row .ck-text{min-height:52px;text-align:center;font-family:var(--f-mono);font-size:20px;font-weight:700}
.lg-ref{font-size:12px;color:var(--t3);margin-top:4px}
.lg-tip{font-size:12px;color:var(--t3);line-height:1.5;text-align:center}
@media(max-width:360px){.ck-step{grid-template-columns:46px minmax(66px,auto) 46px;gap:6px}.ck-step b{font-size:22px}.ck-row>span{letter-spacing:.08em}.ck-card{padding:16px 12px 14px}}
.ck-sum span{display:block;font-family:var(--f-sans);font-size:12px;color:var(--t3)}

/* Guía breve común: ejecución y cambios equivalentes sin alterar la intención */
const EX_GUIDE = {
  'plank-pull-through': {how:'Coloca una kettlebell ligera junto a una mano. En plancha alta, manos bajo hombros y pies separados, pasa la mano contraria por debajo del pecho y arrastra la pesa al otro lado, sin levantarla ni girar la pelvis. Apoya de nuevo la mano y alterna. Cada arrastre cuenta una repetición del lado que tira. Empieza con rodillas apoyadas si hace falta y detente si molesta el hombro o se hunde la lumbar. Usa una superficie despejada que permita deslizar; no una mancuerna que pueda rodar bajo el apoyo. Los 15 kg no son la carga inicial por defecto.',alts:'Pallof press o Dead Bug si el apoyo unilateral molesta. Practica despacio, fuera del AMRAP, y deja margen antes de perder el control.'},
  'woodchop-kb': {how:'De pie, sujeta una kettlebell ligera con ambas manos. Desplázala desde el lateral de una cadera hacia el lado contrario a la altura del pecho, sin llevarla sobre la cabeza. Deja que cadera y pies pivoten juntos; no retuerzas la zona lumbar con los pies clavados. Vuelve despacio y repite; completa un lado antes de cambiar. Codos ligeramente flexionados, pesa cerca del cuerpo y respiración continua. Ensaya primero sin carga. Si 15 kg no permite controlar todo el recorrido con comodidad, usa una pesa más ligera en el gimnasio.',alts:'Bird Dog sin carga; rotación externa con goma si prefieres volver al trabajo de hombro. Reduce el recorrido o cambia si aparece dolor.'},

  'rot-ext': {how:'Codo junto al costado, doblado a 90 grados. Con banda ligera anclada de forma firme, gira el antebrazo hacia fuera sin separar el codo ni rotar el tronco. Ocho por lado sin dolor.',alts:'Scapular Wall Slide; flexión escapular en pared.'},
  'scap-push': {how:'Manos en pared, cuerpo alineado y codos estirados. Acerca y aleja el pecho moviendo solo las escápulas, sin elevar hombros. Ocho repeticiones totales.',alts:'Wall Slide en rango cómodo.'},
  'bird-dog': {how:'A cuatro apoyos, alarga brazo y pierna contrarios sin girar la pelvis ni arquear la espalda. Pausa dos segundos; alterna ocho veces por lado. Acorta el alcance si cuesta.',alts:'Solo deslizar una pierna por el suelo; Dead Bug.'},
  'cat-cow': {how:'A cuatro apoyos, alterna suavemente redondear y extender la espalda, respirando. No lleves el cuello a sus extremos.', alts:'Movimientos pequeños sentado, con manos sobre los muslos.'},
  'world-stretch': {how:'Da una zancada y apoya las manos dentro del pie delantero. Acerca el codo interior sin forzar y rota el brazo hacia arriba; la mirada solo acompaña si resulta cómoda. Puedes apoyar la rodilla trasera.', alts:'Zancada con manos sobre un banco estable, sin rotación si molesta.'},
  'thoracic-rotation': {how:'A cuatro apoyos, lleva una mano detrás de la cabeza y gira el codo hacia arriba sin mover la pelvis. Haz un recorrido pequeño si lo necesitas.', alts:'Open Book tumbado de lado, rodillas juntas y cabeza apoyada.'},
  'wall-slide': {how:'Apoya suavemente espalda y antebrazos en la pared si es cómodo. Desliza los brazos arriba sin sacar las costillas. No fuerces a tocar la pared con la cabeza o las manos.', alts:'Deslizamiento de manos sobre una mesa, sentado, sin dolor.'},
  'ankle-wall': {how:'Frente a la pared, adelanta la rodilla sobre el pie sin despegar el talón. Reduce la distancia hasta conseguirlo sin molestias.', alts:'Balanceo suave de tobillo sentado, sin cargar el peso del cuerpo.'},
  'dead-bug': {how:'Boca arriba, piernas a 90 grados. Extiende brazo y pierna contrarios al exhalar durante tres segundos; vuelve y cambia. Acorta la palanca si la lumbar pierde control. Seis por lado son doce movimientos lentos.', alts:'Marcha supina: baja un pie cada vez manteniendo los brazos apoyados.'},
  'jalon-neutro': {
    how:'Siéntate con los muslos sujetos y un agarre neutro o medio cómodo. Lleva los codos hacia los costados y el agarre hacia la parte alta del pecho sin balancearte. Deja subir los omóplatos de forma natural al extender los brazos. Detente si reproduce la molestia del cuello o trapecio.',

  'press-banca': {

  nordico: {
    how:'Arrodíllate sobre una superficie acolchada y fija bien los tobillos con una máquina, un soporte estable o un compañero. Mantén cadera y tronco alineados. Inclínate desde las rodillas frenando con los isquios; apoya las manos para terminar y ayúdate a volver. Empieza con recorridos cortos.',

/* Deja el estado en una forma que las vistas puedan dibujar aunque la copia venga

    h.id = h.id != null ? String(h.id) : 'h' + h.ts;

        if (Array.isArray(e.setData)) {

            .map(x => ({ kg:numOrNull(x.kg), reps:repsOrNull(x.reps) }))
            .filter(x => x.kg != null || x.reps != null);
          if (!e.setData.length) delete e.setData;
        } else if (e.setData !== undefined) delete e.setData;
        e.id = String(e.id);
        e.kg = numOrNull(e.kg);
        const n = numOrNull(e.sets);
        e.sets = n && n > 0 ? Math.round(n) : (e.setData ? e.setData.length : 0);

    if (s.drafts[old] && typeof s.drafts[old] === 'object') s.drafts[nu] = {...s.drafts[old], ...(s.drafts[nu] || {})};

/* Hasta la 3.x las series se marcaban dentro de una sesión abierta (S.active).
   Si los datos traen una a medias, lo marcado se guarda como una sesión normal. */
function closeLegacySession(s){
  const a = s.active; delete s.active;
  if (!a || typeof a !== 'object' || !a.sets || typeof a.sets !== 'object') return;
  const xs = Array.isArray(a.exercises) ? a.exercises : [];
  const log = (a.setLog && typeof a.setLog === 'object') ? a.setLog : {};
  const ts = Number.isFinite(+a.t0) ? +a.t0 : Date.now();
  const entries = [];
  for (const k of Object.keys(a.sets)) {
    const marks = Array.isArray(a.sets[k]) ? a.sets[k] : [], rows = Array.isArray(log[k]) ? log[k] : [];
    const setData = marks.map((on, i) => on ? rows[i] : null).filter(x => x && typeof x === 'object')
      .map(x => ({ kg:kgOrNull(x.kg), reps:repsOrNull(x.reps) })).filter(x => x.reps);
    if (!setData.length) continue;
    const x = xs.find(v => v && v._uid === k), parts = String(k).split('|');
    const id = String((x && x.id) || parts[0]), nm = String((x && x.nm) || parts[1] || id);
    const kg = setData.reduce((m, v) => v.kg != null && (m == null || v.kg > m) ? v.kg : m, null);
    entries.push({ id, baseId:id, nm, sets:setData.length, reps:setData.map(v => v.reps).join(' / '), kg, setData, ts });
  }
  if (!entries.length || s.history.some(h => h.id === 's' + ts)) return;
  const vol = entries.reduce((t, e) => t + e.setData.reduce((u, v) => u + (v.kg || 0) * v.reps, 0), 0);
  s.history.push({ id:'s' + ts, dayId:LEGACY_DAYS[a.dayId] || a.dayId || 'reloj', ts, dur:0, entries, vol:Math.round(vol), note:String(a.note || '') });
}

/* Reloj guardado: 4.0 guarda la lista de ejercicios (uno, o dos en superserie) y las
   filas que anotas al final; 3.x guardaba un ejercicio y una serie cada vez. */
function sanitizeClock(s){
  const c = s.clock;
  if (!c || typeof c !== 'object' || Array.isArray(c)) { s.clock = null; return; }
  const str = v => typeof v === 'string' ? v : '';
  const oldPhase = c.phase;
  if (!['setup','work','rest','log','done'].includes(c.phase)) c.phase = 'setup';
  if (!Array.isArray(c.items)) c.items = c.exId ? [{id:str(c.exId), nm:str(c.exNm) || str(c.exId)}] : [];
  c.items = c.items.filter(x => x && typeof x === 'object' && x.id).slice(0,2).map(x => ({id:String(x.id), nm:String(x.nm || x.id).slice(0,60)}));
  c.sets = Math.max(1, Math.min(10, Math.round(+c.sets) || 4));
  c.rest = Math.max(15, Math.min(600, Math.round(+c.rest) || 90));
  if (!Number.isInteger(c.done)) {
    const i = Math.max(0, Math.round(+c.i) || 0);
    c.done = oldPhase === 'work' ? i : oldPhase === 'done' ? (Array.isArray(c.log) ? c.log.length : c.sets) : ['rest','log'].includes(oldPhase) ? i + 1 : 0;
  }
  c.done = Math.max(0, Math.min(c.sets, c.done));
  if (!c.rows || typeof c.rows !== 'object' || Array.isArray(c.rows)) c.rows = {};
  if (Array.isArray(c.log) && c.items[0] && !c.rows[c.items[0].id]) c.rows[c.items[0].id] = c.log;
  for (const k of Object.keys(c.rows)) {
    if (!Array.isArray(c.rows[k])) { delete c.rows[k]; continue; }
    c.rows[k] = c.rows[k].slice(0, 10).map(x => (x && typeof x === 'object') ? { kg:kgOrNull(x.kg), reps:repsOrNull(x.reps) } : { kg:null, reps:null });
  }
  if (c.ref && typeof c.ref === 'object' && !Array.isArray(c.ref) && ('setData' in c.ref || 'kg' in c.ref)) c.ref = c.items[0] ? {[c.items[0].id]:c.ref} : {};
  if (!c.ref || typeof c.ref !== 'object' || Array.isArray(c.ref)) c.ref = {};
  if (!c.target || typeof c.target !== 'object' || Array.isArray(c.target)) c.target = {};
  for (const k of ['t0','restEnd','restTotal','left','runId']) c[k] = Number.isFinite(+c[k]) ? +c[k] : 0;
  c.dayId = str(c.dayId); c.custom = str(c.custom);
  c.typing = !!c.typing; c.paused = !!c.paused; c.saved = !!c.saved; c.lastBeep = null;
  for (const k of ['exId','exNm','i','log','draft']) delete c[k];
  // 3.x pedía el peso tras cada serie: a mitad de ejercicio se sigue con la siguiente serie.
  if (oldPhase === 'log' && c.done < c.sets) { c.phase = 'work'; c.t0 = Date.now(); }
  if (['work','rest','log'].includes(c.phase) && (!c.items.length || !c.runId)) c.phase = 'setup';
  if (c.phase === 'log' && !c.done) c.phase = 'setup';
}
/* El plan de cada semana es una lista de 7 días (lunes a domingo) con el entreno de ese día
   o null si descansas. Hasta la 3.x era {entreno: día}, que no permitía repetir Upper. */
function normalizePlanning(s){
  for (const k of ['plans','warmups']) if (!s[k] || typeof s[k] !== 'object' || Array.isArray(s[k])) s[k] = {};
  const ids = new Set(P.days.map(d => d.id));
  for (const [key, plan] of Object.entries(s.plans)) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) { delete s.plans[key]; continue; }
    let arr = null;
    if (Array.isArray(plan)) arr = plan.slice(0, 7);
    else if (plan && typeof plan === 'object') {
      arr = Array(7).fill(null);
      for (const [id, v] of Object.entries(plan)) if (Number.isInteger(v) && v >= 0 && v <= 6 && !arr[v]) arr[v] = LEGACY_DAYS[id] || id;
    }
    if (!arr) { delete s.plans[key]; continue; }
    while (arr.length < 7) arr.push(null);
    s.plans[key] = arr.map(v => ids.has(v) ? v : null);
  }
  for (const [key, w] of Object.entries(s.warmups)) {

function flatEx(day){
  const out = [];
  const walk = bs => bs.forEach(b => {
    if (b.t === 'ex') out.push(b);
    else if (b.t === 'ss') b.items.forEach((x,i) => out.push({...x,pair:b.items.length>1?b.tag:null,pairPosition:i+1}));
    else if (b.t === 'switch') { const v = b.variants[S.picks[b.k]||0] || []; walk(v); }
  });
  walk(day.blocks);
  return out;
}
/* Unidades que se llevan al reloj, en orden: un ejercicio, o los dos de una superserie. */
function dayUnits(day){
  const out = [];
  const walk = bs => bs.forEach(b => {
    if (b.t === 'ex' && b.sets >= 2) out.push([b]);
    else if (b.t === 'ss' && b.items.every(x => x.sets >= 2)) out.push(b.items);
    else if (b.t === 'switch') walk(b.variants[S.picks[b.k]||0] || []);
  });
  walk(day.blocks);
  return out;
}
function repsNum(r){ const m = String(r||'').match(/\d+/); return m ? parseInt(m[0],10) : 0; }
function lastFor(exId){
  for (const h of S.history) { const e = (h.entries||[]).find(x => x.id === exId); if (e) return {...e, ts:e.ts || h.ts}; }
  return null;
}
function renderHere(){ const y=window.scrollY; render(); renderExMenu(); window.scrollTo(0,y); }
function exKey(e){ return e.id+'|'+e.nm; }
/* Ejercicio que haces en un hueco del plan: el del plan o la alternativa que elegiste con ⋯. */
function chosenEx(day, e){
  const want = ((S.drafts[day.id]||{})[exKey(e)]) || e.id;
  return altList(e).find(x => x.id === want) || {id:e.id, nm:e.nm};
}
function orderedAlternatives(e){
  const recent=new Set(S.recents||[]), fav=S.favorites||{};
  return altList(e).sort((a,b)=>(b.id===e.id)-(a.id===e.id)||Number(!!fav[b.id])-Number(!!fav[a.id])||Number(recent.has(b.id))-Number(recent.has(a.id)));
}
function rememberExercise(id){ S.recents=[id,...(S.recents||[]).filter(x=>x!==id)].slice(0,12); }
function restFor(e){ if(e.skipRest)return 0; return (e.rest>=120?S.settings.restStrength:S.settings.restStandard); }
function lastText(id){
  const e=lastFor(id); if(!e)return '';
  const sets=e.setData&&e.setData.length?e.setData.map(s=>setLabel(s)).join(' · '):(e.kg!=null?e.kg+' kg · ':'')+(e.reps||'');
  return sets;
}
const isGym = id => P.days.some(d => d.id === id);
const sameDay = (ts, ref=Date.now()) => dateKey(new Date(ts)) === dateKey(new Date(ref));
function weekCount(ts){
  const w = weekStart(ts || Date.now());
  return S.history.filter(h => weekStart(h.ts) === w && isGym(h.dayId)).length;
}
function doneToday(dayId){ return S.history.some(h => h.dayId === dayId && sameDay(h.ts)); }
function todayEntry(dayId, exId){
  for (const h of S.history) if (h.dayId === dayId && sameDay(h.ts)) { const e = (h.entries||[]).find(x => x.id === exId); if (e) return e; }
  return null;
}
function totalVol(){ return S.history.reduce((a,h) => a + (h.vol||0), 0); }
/* Una sesión por entreno y día: el reloj y los contadores de rondas escriben aquí. */
function sessionKey(dayId, ts){ return 'r-' + dateKey(new Date(ts)) + (dayId && dayId !== 'reloj' ? '-' + dayId : ''); }
function sessionFor(dayId, ts, create){
  const id = sessionKey(dayId, ts);
  let h = S.history.find(x => x.id === id);
  if (!h && create) { h = { id, dayId:dayId || 'reloj', ts, dur:0, entries:[], vol:0, note:'' }; S.history.unshift(h); }
  return h || null;
}
function tidySession(h){
  if (!h.entries.length) { S.history = S.history.filter(x => x !== h); return; }
  h.vol = Math.round(h.entries.reduce((a,e) => a + (e.setData||[]).reduce((b,s) => b + (+s.kg||0)*(+s.reps||0), 0), 0));
  h.dur = Math.max(h.dur||0, Math.min(Date.now() - h.ts, 4*3600e3));
  S.history.sort((a,b) => b.ts - a.ts);
}
function wodRounds(dayId, wk){
  const h = sessionFor(dayId, Date.now(), false), e = h && h.entries.find(x => x.id === wk);
  return e ? e.sets : 0;
}
function setWodRounds(dayId, wk, nm, n){
  const h = sessionFor(dayId, Date.now(), n > 0); if (!h) return;
  h.entries = h.entries.filter(x => x.id !== wk);
  if (n > 0) h.entries.push({ id:wk, nm, sets:n, reps:'rondas', kg:null, ts:Date.now() });
  tidySession(h); save();
}

function weeklyChart(){
  const now = weekStart(Date.now()), weeks = [];
  for (let i = 7; i >= 0; i--) weeks.push({ w: now - i*7*864e5, n: weekCount(now - i*7*864e5) });
  const W = 320, H = 110, bw = W/weeks.length, max = Math.max(4, ...weeks.map(k => k.n));
  const bars = weeks.map((k,i) => {
    const h = Math.max(2, (k.n/max)*72), x = i*bw+bw*.22, y = 82-h;
    return `<rect class="bar${i===weeks.length-1?' now':''}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.56).toFixed(1)}" height="${h.toFixed(1)}" rx="4"/>
      <text x="${(i*bw+bw/2).toFixed(1)}" y="98" text-anchor="middle">${new Date(k.w).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'})}</text>
      <text x="${(i*bw+bw/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle">${k.n||''}</text>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line class="gl" x1="0" y1="82" x2="${W}" y2="82"/>${bars}</svg>`;
}

/* ---------------- vista: PROGRESO ---------------- */
let LIFT = null;
/* Todos los ejercicios con historial, con los principales delante. */
function trackedLifts(){
  const seen = new Map();
  for (const h of S.history) for (const e of (h.entries||[])) {
    if (!e || !e.id || e.reps === 'rondas') continue;
    if (!seen.has(e.id)) seen.set(e.id, e.nm || e.id);
  }
  const keys = P.keyLifts.filter(id => seen.has(id));
  const rest = [...seen.keys()].filter(id => !keys.includes(id)).sort((a,b) => String(seen.get(a)).localeCompare(String(seen.get(b)),'es'));
  return [...keys, ...rest].map(id => ({id, nm: P.shortNames && P.shortNames[id] || seen.get(id)}));
}
/* Una fila por sesión en la que aparece el ejercicio: mejor serie, volumen y 1RM estimado. */
function liftSessions(id){
  return S.history.filter(h => (h.entries||[]).some(e => e.id === id))
    .map(h => {
      const e = h.entries.find(x => x.id === id);
      const sets = (e.setData && e.setData.length) ? e.setData : (e.kg != null ? [{kg:+e.kg, reps:repsNum(e.reps)}] : []);
      const withKg = sets.filter(s => s && s.kg != null && +s.kg > 0);
      const top = withKg.reduce((m,s) => (!m || +s.kg > +m.kg || (+s.kg === +m.kg && (+s.reps||0) > (+m.reps||0))) ? s : m, null);
      const vol = sets.reduce((a,s) => a + (+s.kg||0)*(+s.reps||0), 0);
      return { ts:h.ts, sets, top, vol:Math.round(vol), e1rm: top ? Math.round(+top.kg * (1 + (+top.reps||1)/30)) : null };
    })
    .sort((a,b) => a.ts - b.ts);
}
function liftChart(rows){
  if (rows.length < 2) return `<div class="tip"><span>Con dos sesiones anotadas aparece aquí la curva de progreso.</span></div>`;
  const pts = rows.slice(-10), W=320, H=132, L=30, B=20;
  const vals = pts.flatMap(p => [p.top?+p.top.kg:null, p.e1rm]).filter(v => v != null);
  const min = Math.min(...vals), max = Math.max(...vals), rg = (max-min)||1;
  const x = i => L + (pts.length===1?0:(i/(pts.length-1))*(W-L-8));
  const y = v => H-B - ((v-min)/rg)*(H-B-12);
  const line = (sel) => pts.map((p,i) => { const v = sel(p); return v==null?null:`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`; }).filter(Boolean).join(' ');
  const kgLine = line(p => p.top?+p.top.kg:null), rmLine = line(p => p.e1rm);
  const dots = pts.map((p,i) => p.top?`<circle cx="${x(i).toFixed(1)}" cy="${y(+p.top.kg).toFixed(1)}" r="3.4"/>`:'').join('');
  const labels = pts.map((p,i) => (i===0||i===pts.length-1||pts.length<=4)
    ? `<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="${i===0?'start':i===pts.length-1?'end':'middle'}">${esc(dstr(p.ts))}</text>`:'').join('');
  return `<svg class="pchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progresión de peso por sesión">
      <line class="gl" x1="${L}" y1="${y(max).toFixed(1)}" x2="${W-4}" y2="${y(max).toFixed(1)}"/>
      <line class="gl" x1="${L}" y1="${y(min).toFixed(1)}" x2="${W-4}" y2="${y(min).toFixed(1)}"/>
      <text class="ax" x="2" y="${(y(max)+3).toFixed(1)}">${max}</text>
      <text class="ax" x="2" y="${(y(min)+3).toFixed(1)}">${min}</text>
      <path class="rm" d="${rmLine}"/><path class="kg" d="${kgLine}"/>${dots}
      <g class="ax">${labels}</g></svg>
    <div class="plegend"><span><i class="kg"></i>Mejor serie</span><span><i class="rm"></i>1RM estimado</span></div>`;
}
function weekKey(ts){ return weekStart(ts); }
function liftDelta(rows){
  if (!rows.length) return '';
  const now = weekStart(Date.now()), wk = new Map();
  for (const r of rows) { const k = weekKey(r.ts); if (!wk.has(k) || (r.top && (!wk.get(k).top || +r.top.kg > +wk.get(k).top.kg))) wk.set(k, r); }
  const keys = [...wk.keys()].sort((a,b) => a-b);
  const thisWeek = wk.get(now), prevKey = keys.filter(k => k < now).pop(), prev = prevKey != null ? wk.get(prevKey) : null;
  if (!thisWeek || !thisWeek.top) return `<div class="tip"><span>Aún no has anotado este ejercicio esta semana. La última vez: <b>${esc(rows[rows.length-1].top?setLabel(rows[rows.length-1].top):'—')}</b>.</span></div>`;
  if (!prev || !prev.top) return `<div class="tip"><span>Esta semana: <b>${esc(setLabel(thisWeek.top))}</b>. Cuando repitas el ejercicio otra semana verás aquí la diferencia.</span></div>`;
  const d = +thisWeek.top.kg - +prev.top.kg, dv = thisWeek.vol - prev.vol;
  const cls = d > 0 ? 'up' : d < 0 ? 'down' : 'flat';
  const txt = d > 0 ? `+${d} kg` : d < 0 ? `${d} kg` : 'mismo peso';
  return `<div class="delta ${cls}"><b>${esc(txt)}</b><span>respecto a la semana anterior · ${esc(setLabel(prev.top))} → ${esc(setLabel(thisWeek.top))}${dv?` · volumen ${dv>0?'+':''}${dv} kg`:''}</span></div>`;
}
function weeklyVolume(){
  const now = weekStart(Date.now()), weeks = [];
  for (let i = 7; i >= 0; i--) weeks.push(now - i*7*864e5);
  const vol = weeks.map(w => S.history.filter(h => weekStart(h.ts) === w).reduce((a,h) => a + (h.vol||0), 0));
  const max = Math.max(...vol, 1);
  return `<div class="wvol">${weeks.map((w,i) => `<div class="wv"><i style="height:${Math.max(3, Math.round(vol[i]/max*54))}px" class="${i===weeks.length-1?'now':''}"></i>
    <span>${new Date(w).getDate()}/${new Date(w).getMonth()+1}</span></div>`).join('')}</div>
    <div class="wvol-foot"><span>Volumen por semana</span><span>${vol[vol.length-1]?vol[vol.length-1]+' kg esta semana':'sin registro esta semana'}</span></div>`;
}

function manualSave(){

  if (!m.exId || !sets.length) return;
  const nm = clockName(m.exId);
  const [y, mo, d] = m.date.split('-').map(Number);
  let ts = new Date(y, (mo||1) - 1, d||1, 12, 0, 0).getTime();
  if (!Number.isFinite(ts) || ts > Date.now()) ts = Date.now();
  const best = sets.reduce((a, x) => (x.kg != null && (a == null || x.kg > a)) ? x.kg : a, null);
  const vol = Math.round(sets.reduce((a, x) => a + (x.kg||0) * x.reps, 0));
  S.history.push({ id:'m' + Date.now(), dayId:'manual', ts, dur:0, vol, note:'', entries:[{ id:m.exId, baseId:m.exId, nm, sets:sets.length,

/* ---------------- descanso / cronómetro ---------------- */
const R2 = 34, C2 = 2*Math.PI*R2;
let RT = { mode:'down',end:0,total:0,int:null,done:false,running:false,started:0,elapsed:0,paused:0,minimized:false,ready:false,hasStarted:false };
function syncTimerDock(){
  const dock=$('#timer-dock');
  dock.classList.toggle('on',RT.minimized&&!RT.done);
  dock.textContent=(RT.mode==='up'?'Cronómetro':'Descanso')+' · '+$('#sh-t').textContent+(RT.running?'':RT.hasStarted?' · pausado':' · listo')+' ↗';
}
function startRest(sec, nm, sub){
  RT.minimized=false;syncTimerDock();
  sec = +sec || S.settings.rest;
  RT.mode='down';RT.total = sec; RT.end = Date.now() + sec*1000; RT.done = false;RT.running=true;RT.paused=0;
  RT.ready=true;RT.hasStarted=true;
  $('#sh-nm').textContent = nm || 'Descanso';
  $('#sh-sub').textContent = sub || '';
  $('#sheet').classList.add('on');
  clearInterval(RT.int); RT.int = setInterval(tickRest, 200); tickRest();
}
function tickRest(){
  $('#mode-down').classList.toggle('on',RT.mode==='down');$('#mode-up').classList.toggle('on',RT.mode==='up');
  const pause=$('[data-act="timer-pause"]');if(pause)pause.textContent=RT.running?'Pausar':RT.hasStarted&&!RT.done?'Reanudar':'Iniciar';
  $$('#sheet [data-act="rest-"],#sheet [data-act="rest+"],#sheet [data-act="rest30"]').forEach(b=>{b.disabled=RT.mode==='up';});
  if(RT.mode==='up'){
    const seconds=(RT.elapsed+(RT.running?Date.now()-RT.started:0))/1000;
    $('#sh-t').textContent=mmss(seconds);$('#sh-fg').setAttribute('stroke-dasharray',`${C2.toFixed(1)} ${C2.toFixed(1)}`);syncTimerDock();return;
  }
  const left = RT.running ? Math.max(0, (RT.end - Date.now())/1000) : RT.paused;
  $('#sh-t').textContent = mmss(left);
  const pct = RT.total ? left/RT.total : 0;
  $('#sh-fg').setAttribute('stroke-dasharray', `${(C2*pct).toFixed(1)} ${C2.toFixed(1)}`);
  if (left <= 0 && RT.running && !RT.done) {
    RT.done = true; clearInterval(RT.int);
    RT.running=false;RT.hasStarted=false;
    $('#sh-t').textContent = '¡Ya!'; beep(true); haptic([130,90,130]);
    setTimeout(() => { if (RT.done) $('#sheet').classList.remove('on'); }, 2500);
  }
  syncTimerDock();
}
function addRest(s){
  if(RT.mode!=='down')return;
  const left = RT.running?Math.max(0,Math.ceil((RT.end-Date.now())/1000)):RT.paused;
  const next = Math.max(5, left+s);
  if (RT.done) RT.done = false;
  RT.total = next;if(RT.running)RT.end=Date.now()+next*1000;else RT.paused=next;
  clearInterval(RT.int);if(RT.running)RT.int=setInterval(tickRest,200);tickRest();
}
function timerMode(mode){
  clearInterval(RT.int);RT.mode=mode;RT.done=false;RT.running=false;RT.ready=true;RT.hasStarted=false;RT.minimized=false;
  RT.elapsed=0;RT.started=0;RT.end=0;
  RT.total=S.settings.restStandard;RT.paused=RT.total;
  $('#sh-nm').textContent=mode==='up'?'Cronómetro':'Temporizador manual';
  $('#sh-sub').textContent='Pulsa Iniciar cuando estés listo';
  $('#sheet').classList.add('on');tickRest();
}
function pauseTimer(){
  if(RT.running){if(RT.mode==='up')RT.elapsed+=Date.now()-RT.started;else RT.paused=Math.max(0,(RT.end-Date.now())/1000);RT.running=false;clearInterval(RT.int);}
  else {if(RT.done&&RT.mode==='down')RT.paused=RT.total;RT.done=false;RT.running=true;RT.hasStarted=true;if(RT.mode==='up')RT.started=Date.now();else RT.end=Date.now()+RT.paused*1000;RT.int=setInterval(tickRest,200);}
  $('#sh-sub').textContent=RT.running?'En marcha':'En pausa';
  tickRest();
}
function resetTimer(){clearInterval(RT.int);RT.elapsed=0;RT.started=0;RT.paused=RT.total;RT.end=0;RT.done=false;RT.running=false;RT.hasStarted=false;$('#sh-sub').textContent='Pulsa Iniciar cuando estés listo';tickRest();}
function skipRest(){ clearInterval(RT.int); RT.done = true;RT.running=false;RT.ready=false;RT.hasStarted=false;RT.minimized=false; $('#sheet').classList.remove('on');syncTimerDock(); }
function wodSecs(clk){ const m = String(clk).match(/(\d+)[:\s]*(\d+)?/); if (!m) return 600; return m[2] != null ? (+m[1])*60 + (+m[2]) : (+m[1])*60; }
function wodKey(b){ return 'wod|'+b.hd+'|'+b.clk; }

/* ---------------- wake lock ---------------- */
let WL = null;
async function wake(on){
  try {
    if (on && 'wakeLock' in navigator && !WL) { WL = await navigator.wakeLock.request('screen'); WL.addEventListener('release', () => WL = null); }
    else if (!on && WL) { await WL.release(); WL = null; }
  } catch(e){}
}

function exportData(){
  const blob = new Blob([JSON.stringify({ app:'entreno', v:P.version, exported:Date.now(), data:S }, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);

  document.body.appendChild(a); a.click(); a.remove();

function importData(file){
  if (!file || file.size > 5*1024*1024) { toast('La copia no es válida o supera 5 MB.'); return; }
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const j = JSON.parse(rd.result); const d = j.data || j;
      if (!d || typeof d !== 'object' || !Array.isArray(d.history) || d.history.length > 1000) throw 0;
      if (!confirm(`Vas a sustituir tus datos por la copia (${d.history.length} sesiones). ¿Seguir?`)) return;
      S = sanitizeState(JSON.parse(JSON.stringify(d)));
      clockLoop(); save(); render(); toast('Datos importados.');
    } catch(e){ toast('Ese archivo no es una copia válida.'); }
  };
  rd.readAsText(file);
}
